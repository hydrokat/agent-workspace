name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify versions match tag
        run: |
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0, 'tandem/src'); from tandem.versions import verify_release_versions; ok, msg = verify_release_versions(sys.argv[1], Path('.')); print(msg); sys.exit(0 if ok else 1)" "${{ github.ref_name }}"

  build:
    needs: verify
    uses: ./.github/workflows/build-binary.yml

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tandem-binary-*
          merge-multiple: true
      - name: Generate combined SHA256SUMS
        working-directory: artifacts
        run: |
          cat -- *.sha256 > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          FILES=(artifacts/tandem-* artifacts/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "${FILES[@]}" --verify-tag --generate-notes
          fi

name: ci

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm test

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: pip install pytest
      - run: pytest test/skills

  tandem-ubuntu:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tandem
    env:
      TANDEM_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tandem
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  tandem-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tandem
    env:
      TANDEM_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tandem
      - run: brew install tmux
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: cargo test --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' tandem/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Rust Crate Coverage
        working-directory: tandem
        env:
          TANDEM_TEST_STRICT: "1"
        run: cargo llvm-cov --fail-under-lines 78 --summary-only
      - name: Node Installer Coverage
        run: |
          COVERAGE_OUT=$(npm run test:coverage)
          echo "$COVERAGE_OUT"
          LINE_PCT=$(echo "$COVERAGE_OUT" | grep 'all files' | awk '{print $4}' | cut -d'.' -f1)
          echo "Total Line Coverage: $LINE_PCT%"
          if [ "$LINE_PCT" -lt 83 ]; then
            echo "Line coverage $LINE_PCT% is below floor 83%"
            exit 1
          fi

  binary:
    uses: ./.github/workflows/build-binary.yml

[project]
name = "tandem"
version = "0.1.0"
description = "Multi-agent terminal workspace: planners and implementers side-by-side in tmux."
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
tandem = "tandem.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tandem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures/"]

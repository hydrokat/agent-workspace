[project]
name = "tandem"
version = "1.3.1"
description = "Multi-agent terminal workspace: planners and implementers side-by-side in tmux."
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8"]

[project.scripts]
tandem = "tandem.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "mypy>=2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tandem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures/"]
